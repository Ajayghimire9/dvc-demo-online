[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "customerflow"
version = "1.0.0"
description = "Reproducible customer value modelling with DVC and FastAPI"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "fastapi>=0.115,<1",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "httpx>=0.27,<1"]
ops = ["dvc>=3.50,<4", "mlflow>=2.15,<4", "uvicorn[standard]>=0.30,<1"]

[project.scripts]
customerflow-ingest = "customerflow.ingest:main"
customerflow-train = "customerflow.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
